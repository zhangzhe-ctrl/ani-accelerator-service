  string recorded_state = 4 [json_name="recorded_state"];
}
message InitializationStep {
  string step_id = 1 [json_name="step_id"];
  string object_key = 2 [json_name="object_key"];
  string kind = 3;
  string state = 4;
  string resource_id = 5 [json_name="resource_id"];
  uint64 input_group_version = 6 [json_name="input_group_version"];
  uint64 output_group_version = 7 [json_name="output_group_version"];
  string reason = 8;
