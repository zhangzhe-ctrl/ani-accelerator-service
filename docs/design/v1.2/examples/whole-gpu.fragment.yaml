  annotations:
    volcano.sh/vgpu-mode: hami-core
spec:
  schedulerName: volcano
  nodeSelector:
    accelerator.ani.io/supply-group: 00000012-1111-4111-8111-000000000012
    accelerator.ani.io/model-key: example-24g-verified
    accelerator.ani.io/baseline-id: 00000005-1111-4111-8111-000000000005
  containers:
