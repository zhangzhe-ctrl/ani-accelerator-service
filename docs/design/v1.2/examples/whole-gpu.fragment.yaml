# 示例F=1024已冻结；共享每Pod写6块，不是6144。不要用于未核验基线。
metadata:
  labels:
    accelerator.ani.io/resource-id: 00000007-1111-4111-8111-000000000007
    accelerator.ani.io/create-operation-id: 00000008-1111-4111-8111-000000000008
    accelerator.ani.io/resource-tenant-id: 00000006-1111-4111-8111-000000000006
